name: my_app
description: AI Chat App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.1.0
  flutter_tts: ^3.8.5
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  uuid: ^4.4.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#ffffff"
  macos:
    generate: true
    image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/bylaws.txt
    - assets/icon.png